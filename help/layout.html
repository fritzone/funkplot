<!doctype html>
<html>
<head>
<meta charset='UTF-8'><meta name='viewport' content='width=device-width initial-scale=1'>
<style type='text/css'>
html {overflow-x: initial !important;}:root { --bg-color:#ffffff; --text-color:#333333; --monospace:"Lucida Console",Consolas,"Courier",monospace; }
body { 
    font-family: "Open Sans","Clear Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: rgb(51, 51, 51);
    line-height: 1.6;
    margin: 0px; 
    padding: 30px; 
    height: auto; 
}
#write { max-width: 860px; margin: 0 auto; }
h1, h2, h3, h4, h5, h6 { font-weight: bold; line-height: 1.4; margin-top: 1rem; margin-bottom: 1rem; }
h1 { font-size: 2.25em; border-bottom: 1px solid #eee; }
h2 { font-size: 1.75em; border-bottom: 1px solid #eee; }
h3 { font-size: 1.5em; }
code, pre { font-family: var(--monospace); background-color: #f8f8f8; border-radius: 3px; }
pre { padding: 10px; overflow-x: auto; white-space: pre-wrap; border: 1px solid #e7eaed; }
code { padding: 2px 4px; background-color: #f3f4f4; }
img { max-width: 100%; vertical-align: middle; }
blockquote { border-left: 4px solid #dfe2e5; padding: 0 15px; color: #777; margin: 1rem 0; }
table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
table th, table td { border: 1px solid #dfe2e5; padding: 6px 13px; }
table tr:nth-child(2n) { background-color: #f8f8f8; }
</style>
<title>{{title}}</title>
</head>
<body>
<div id='write'>
{{content}}
</div>
</body>
</html>
